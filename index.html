<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบติดตามงาน (Tracking Job Board)</title>
  <!-- Tailwind CSS สำหรับตกแต่ง UI -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">

  <!-- ========================================== -->
  <!-- 1. หน้าจอ LOGIN                            -->
  <!-- ========================================== -->
  <div id="loginSection" class="flex items-center justify-center min-h-screen p-4">
    <div class="bg-white p-8 rounded-xl shadow-lg max-w-md w-full">
      <h2 class="text-2xl font-bold text-center text-gray-800 mb-6">🔐 เข้าสู่ระบบ Tracking Job</h2>
      
      <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700">Username</label>
          <input type="text" id="loginUsername" class="mt-1 w-full border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-indigo-500 outline-none" required>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700">Password</label>
          <input type="password" id="loginPassword" class="mt-1 w-full border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-indigo-500 outline-none" required>
        </div>
        
        <button type="submit" id="loginBtn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2.5 rounded-lg transition">
          เข้าสู่ระบบ
        </button>
      </form>
    </div>
  </div>

  <!-- ========================================== -->
  <!-- 2. หน้าหลัก DASHBOARD & JOB BOARD            -->
  <!-- ========================================== -->
  <div id="appSection" class="hidden p-4 md:p-6 max-w-7xl mx-auto">
    
    <!-- Header & User Info -->
    <div class="flex flex-col md:flex-row justify-between items-center bg-white p-4 rounded-xl shadow mb-6 gap-4">
      <div>
        <h1 class="text-2xl font-bold text-gray-800">📌 ระบบติดตามงาน (Tracking Job Board)</h1>
        <p class="text-sm text-gray-500">ยินดีต้อนรับ, <span id="currentUserDisplay" class="font-bold text-indigo-600">-</span> (<span id="currentRoleDisplay">-</span>)</p>
      </div>
      <div class="flex gap-2">
        <button onclick="openCreateModal()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-4 py-2 rounded-lg transition text-sm flex items-center gap-1">
          ➕ สร้างงานใหม่
        </button>
        <button onclick="handleLogout()" class="bg-gray-200 hover:bg-gray-300 text-gray-700 font-bold px-4 py-2 rounded-lg transition text-sm">
          ออกจากระบบ
        </button>
      </div>
    </div>

    <!-- พื้นที่แสดงการ์ดรายการงาน -->
    <div id="jobList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
      <!-- Cards จะถูกเรนเดอร์ผ่าน JavaScript -->
    </div>
  </div>

  <!-- ========================================== -->
  <!-- 3. MODAL EDIT / CREATE FORM                -->
  <!-- ========================================== -->
  <div id="jobModal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-xl shadow-xl max-w-lg w-full p-6 relative max-h-[90vh] overflow-y-auto">
      
      <!-- ปุ่มปิด Modal -->
      <button onclick="closeModal()" class="absolute top-3 right-3 text-gray-400 hover:text-gray-600 font-bold text-xl">&times;</button>
      
      <h2 id="modalTitle" class="text-xl font-bold text-gray-800 mb-4">✏️ แก้ไขรายการงาน</h2>

      <form id="jobForm" onsubmit="saveJob(event)" class="space-y-4">
        <input type="hidden" id="editJobId">

        <div>
          <label class="block text-sm font-medium text-gray-700">หัวข้องาน</label>
          <input type="text" id="editTitle" class="mt-1 w-full border border-gray-300 rounded-lg p-2 focus:ring-2 focus:ring-indigo-500 outline-none" required>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700">ผู้แจ้งงาน (Requester)</label>
          <input type="text" id="editRequester" class="mt-1 w-full border border-gray-300 rounded-lg p-2 focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700">ผู้รับผิดชอบ (Assignee)</label>
          <input type="text" id="editAssignee" placeholder="หากยังไม่มีให้ใส่ 'ไม่ระบุ' หรือเว้นว่าง" class="mt-1 w-full border border-gray-300 rounded-lg p-2 focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-gray-700">สถานะ</label>
            <select id="editStatus" class="mt-1 w-full border border-gray-300 rounded-lg p-2 focus:ring-2 focus:ring-indigo-500 outline-none">
              <option value="Pending">Pending</option>
              <option value="In Progress">In Progress</option>
              <option value="Completed">Completed</option>
            </select>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700">กำหนดเสร็จ</label>
            <input type="date" id="editDueDate" class="mt-1 w-full border border-gray-300 rounded-lg p-2 focus:ring-2 focus:ring-indigo-500 outline-none">
          </div>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700">รายละเอียดงาน</label>
          <textarea id="editDetails" rows="3" class="mt-1 w-full border border-gray-300 rounded-lg p-2 focus:ring-2 focus:ring-indigo-500 outline-none"></textarea>
        </div>

        <!-- 🖼️ ส่วนแสดงและอัปโหลดรูปภาพแนบใน Modal -->
        <div class="border-t pt-4">
          <label class="block text-sm font-medium text-gray-700 mb-2">🖼️ รูปภาพประกอบ</label>
          
          <!-- แสดง Preview รูปภาพเดิม (ถ้ามี) -->
          <div id="imagePreviewContainer" class="hidden mb-3">
            <img id="editImagePreview" src="" alt="รูปแนบ" class="w-full h-48 object-cover rounded-lg border">
          </div>

          <!-- ช่องเลือกอัปโหลดรูปใหม่ -->
          <input type="file" id="editImageFile" accept="image/*" onchange="previewSelectedImage(event)" class="w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100">
        </div>

        <div class="flex justify-between gap-2 pt-4 border-t">
          <button type="button" id="deleteBtn" onclick="confirmDeleteJob()" class="px-4 py-2 bg-red-100 text-red-600 rounded-lg hover:bg-red-200 font-bold hidden">
            🗑️ ลบงาน
          </button>
          
          <div class="flex gap-2 ml-auto">
            <button type="button" onclick="closeModal()" class="px-4 py-2 bg-gray-200 text-gray-700 rounded-lg hover:bg-gray-300">ยกเลิก</button>
            <button type="submit" id="saveBtn" class="px-4 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 font-bold">บันทึกข้อมูล</button>
          </div>
        </div>
      </form>

    </div>
  </div>

  <!-- ========================================== -->
  <!-- 4. JAVASCRIPT LOGIC                        -->
  <!-- ========================================== -->
  <script>
    // ⚠️ ใส่ Web App URL ที่ได้จาก Google Apps Script (Code.gs)
    const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbwPk6LFD1uxljIuVzpjprq41GZbFekaGmGtcO99d9gMcl6jlIIOtoGYgWuMJF98vv4C/exec';

    let allJobs = [];
    let currentUser = null;

    // ------------------------------------------
    // 1. ระบบ LOGIN & LOGOUT
    // ------------------------------------------
    async function handleLogin(e) {
      e.preventDefault();
      const usernameInput = document.getElementById('loginUsername').value;
      const passwordInput = document.getElementById('loginPassword').value;
      const loginBtn = document.getElementById('loginBtn');

      try {
        loginBtn.disabled = true;
        loginBtn.innerText = 'กำลังตรวจสอบ...';

        const response = await fetch(WEB_APP_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: 'login', username: usernameInput, password: passwordInput })
        });

        const result = await response.json();

        if (result.status === 'success') {
          currentUser = result.user;
          document.getElementById('currentUserDisplay').innerText = currentUser.name;
          document.getElementById('currentRoleDisplay').innerText = currentUser.role;

          document.getElementById('loginSection').classList.add('hidden');
          document.getElementById('appSection').classList.remove('hidden');

          fetchJobs(); // โหลดรายการงาน
        } else {
          alert('เข้าสู่ระบบไม่สำเร็จ: ' + result.message);
        }
      } catch (err) {
        alert('เกิดข้อผิดพลาดในการเชื่อมต่อระบบ');
        console.error(err);
      } finally {
        loginBtn.disabled = false;
        loginBtn.innerText = 'เข้าสู่ระบบ';
      }
    }

    function handleLogout() {
      currentUser = null;
      document.getElementById('loginForm').reset();
      document.getElementById('appSection').classList.add('hidden');
      document.getElementById('loginSection').classList.remove('hidden');
    }

    // ------------------------------------------
    // 2. ดึงข้อมูลรายการงาน และเรียง Unassigned ขึ้นก่อน
    // ------------------------------------------
    async function fetchJobs() {
      try {
        const response = await fetch(WEB_APP_URL);
        const result = await response.json();

        if (result.status === 'success') {
          allJobs = result.data || [];
          renderJobs();
        }
      } catch (err) {
        console.error('Error fetching jobs:', err);
      }
    }

    function renderJobs() {
      const jobListContainer = document.getElementById('jobList');
      jobListContainer.innerHTML = '';

      // จัดเรียง: งานที่ไม่ระบุคน (Unassigned) ขึ้นมาด้านบนสุดก่อน
      const sortedJobs = [...allJobs].sort((a, b) => {
        const assigneeA = (a.Assignee || '').trim();
        const assigneeB = (b.Assignee || '').trim();

        const isUnassignedA = !assigneeA || assigneeA === 'ไม่ระบุ' || assigneeA === '-';
        const isUnassignedB = !assigneeB || assigneeB === 'ไม่ระบุ' || assigneeB === '-';

        if (isUnassignedA && !isUnassignedB) return -1;
        if (!isUnassignedA && isUnassignedB) return 1;
        return (b.Job_ID || '').localeCompare(a.Job_ID || '');
      });

      // เรนเดอร์การ์ดงาน
      sortedJobs.forEach(job => {
        const isUnassigned = !job.Assignee || job.Assignee === 'ไม่ระบุ' || job.Assignee === '-';
        const hasImage = job.Image_URL && job.Image_URL.trim() !== '';

        const card = document.createElement('div');
        card.className = `bg-white p-4 rounded-xl shadow border-l-4 ${isUnassigned ? 'border-red-500 bg-red-50/20' : 'border-indigo-500'} hover:shadow-md transition`;

        card.innerHTML = `
          <div class="flex justify-between items-start mb-2">
            <span class="text-xs font-bold px-2 py-1 bg-gray-100 text-gray-700 rounded">${job.Job_ID}</span>
            <span class="text-xs font-semibold px-2.5 py-1 rounded-full ${getStatusBadgeClass(job.Status)}">${job.Status}</span>
          </div>

          <h3 class="font-bold text-gray-800 text-base mb-2 line-clamp-2">${job.Title}</h3>
          
          <div class="text-sm text-gray-600 mb-3 space-y-1">
            <p>👤 ผู้รับผิดชอบ: <span class="${isUnassigned ? 'text-red-500 font-bold' : 'font-medium'}">${isUnassigned ? '⚠️ ไม่ระบุ' : job.Assignee}</span></p>
            ${job.DueDate ? `<p class="text-xs text-gray-500">📅 กำหนดส่ง: ${job.DueDate}</p>` : ''}
          </div>

          <div class="flex justify-between items-center pt-3 border-t text-xs">
            <!-- ซ่อนรูปภาพในการ์ด แสดงเฉพาะป้ายบอกว่ามีรูปแนบหรือไม่ -->
            <div>
              ${hasImage ? '<span class="inline-flex items-center gap-1 text-indigo-600 bg-indigo-50 px-2 py-1 rounded border border-indigo-200">🖼️ มีรูปแนบ</span>' : '<span class="text-gray-400">ไม่มีรูป</span>'}
            </div>

            <button onclick="openEditModal('${job.Job_ID}')" class="text-indigo-600 hover:text-indigo-800 font-bold underline">
              ✏️ ดู / แก้ไข
            </button>
          </div>
        `;

        jobListContainer.appendChild(card);
      });
    }

    function getStatusBadgeClass(status) {
      if (status === 'Completed') return 'bg-green-100 text-green-800';
      if (status === 'In Progress') return 'bg-yellow-100 text-yellow-800';
      return 'bg-gray-100 text-gray-800';
    }

    // ------------------------------------------
    // 3. MODAL EDIT & CREATE LOGIC
    // ------------------------------------------
    function openCreateModal() {
      document.getElementById('jobForm').reset();
      document.getElementById('editJobId').value = '';
      document.getElementById('modalTitle').innerText = '➕ สร้างงานใหม่';
      document.getElementById('editRequester').value = currentUser ? currentUser.name : '';
      document.getElementById('imagePreviewContainer').classList.add('hidden');
      document.getElementById('deleteBtn').classList.add('hidden');
      document.getElementById('jobModal').classList.remove('hidden');
    }

    function openEditModal(jobId) {
      const job = allJobs.find(j => j.Job_ID === jobId);
      if (!job) return;

      document.getElementById('modalTitle').innerText = '✏️ แก้ไขรายการงาน';
      document.getElementById('editJobId').value = job.Job_ID;
      document.getElementById('editTitle').value = job.Title || '';
      document.getElementById('editRequester').value = job.Requester || '';
      document.getElementById('editAssignee').value = job.Assignee || '';
      document.getElementById('editStatus').value = job.Status || 'Pending';
      document.getElementById('editDueDate').value = job.DueDate || '';
      document.getElementById('editDetails').value = job.Details || '';

      // แสดงรูปภาพใน Modal (ถ้ามี)
      const imgPreviewContainer = document.getElementById('imagePreviewContainer');
      const imgPreview = document.getElementById('editImagePreview');

      if (job.Image_URL && job.Image_URL.trim() !== '') {
        imgPreview.src = job.Image_URL;
        imgPreviewContainer.classList.remove('hidden');
      } else {
        imgPreview.src = '';
        imgPreviewContainer.classList.add('hidden');
      }

      document.getElementById('deleteBtn').classList.remove('hidden');
      document.getElementById('jobModal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('jobModal').classList.add('hidden');
      document.getElementById('jobForm').reset();
    }

    function previewSelectedImage(event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          document.getElementById('editImagePreview').src = e.target.result;
          document.getElementById('imagePreviewContainer').classList.remove('hidden');
        };
        reader.readAsDataURL(file);
      }
    }

    function convertFileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => resolve(reader.result);
        reader.onerror = error => reject(error);
      });
    }

    // ------------------------------------------
    // 4. บันทึก (สร้าง / แก้ไข) และ ลบงาน
    // ------------------------------------------
    async function saveJob(e) {
      e.preventDefault();
      
      const saveBtn = document.getElementById('saveBtn');
      const jobId = document.getElementById('editJobId').value;
      const isCreate = !jobId;
      const fileInput = document.getElementById('editImageFile');
      const file = fileInput.files[0];

      let imageBase64 = '';
      if (file) {
        imageBase64 = await convertFileToBase64(file);
      }

      const payload = {
        action: isCreate ? 'create' : 'update',
        data: {
          jobId: jobId,
          title: document.getElementById('editTitle').value,
          requester: document.getElementById('editRequester').value,
          assignee: document.getElementById('editAssignee').value,
          status: document.getElementById('editStatus').value,
          dueDate: document.getElementById('editDueDate').value,
          details: document.getElementById('editDetails').value,
          imageBase64: imageBase64
        }
      };

      try {
        saveBtn.disabled = true;
        saveBtn.innerText = 'กำลังบันทึก...';

        const response = await fetch(WEB_APP_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload)
        });

        const result = await response.json();

        if (result.status === 'success') {
          closeModal();
          fetchJobs(); // โหลดรายการใหม่
        } else {
          alert('บันทึกไม่สำเร็จ: ' + result.message);
        }
      } catch (err) {
        console.error('Error saving job:', err);
        alert('เกิดข้อผิดพลาดในการบันทึกข้อมูล');
      } finally {
        saveBtn.disabled = false;
        saveBtn.innerText = 'บันทึกข้อมูล';
      }
    }

    async function confirmDeleteJob() {
      const jobId = document.getElementById('editJobId').value;
      if (!jobId || !confirm(`คุณต้องการลบรายการ ${jobId} ใช่หรือไม่?`)) return;

      try {
        const response = await fetch(WEB_APP_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: 'delete', jobId: jobId })
        });

        const result = await response.json();

        if (result.status === 'success') {
          closeModal();
          fetchJobs();
        } else {
          alert('ลบงานไม่สำเร็จ: ' + result.message);
        }
      } catch (err) {
        console.error('Error deleting job:', err);
        alert('เกิดข้อผิดพลาดในการลบรายการ');
      }
    }
  </script>
</body>
</html>
