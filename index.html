<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TrackingJob System</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Prompt', sans-serif; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

  <!-- Header -->
  <header class="sticky top-0 z-30 bg-white/80 backdrop-blur-md border-b border-slate-200 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3.5 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="bg-indigo-600 text-white p-2.5 rounded-2xl shadow-indigo-200 shadow-md">
          <i class="fa-solid fa-bars-progress text-xl"></i>
        </div>
        <div>
          <h1 class="text-lg font-bold text-slate-900 leading-tight">TrackingJob</h1>
          <p class="text-xs text-slate-500 hidden sm:block">ระบบติดตามและจัดการงาน</p>
        </div>
      </div>
      <button onclick="openModal()" class="bg-indigo-600 hover:bg-indigo-700 active:scale-95 text-white px-4 py-2.5 rounded-xl text-sm font-medium transition shadow-md shadow-indigo-100 flex items-center gap-2">
        <i class="fa-solid fa-plus"></i>
        <span>สร้างงานใหม่</span>
      </button>
    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 flex-1 w-full">
    
    <!-- Metrics Cards -->
    <div class="grid grid-cols-2 md:grid-cols-4 gap-3 sm:gap-4 mb-6">
      <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex items-center space-x-3">
        <div class="p-3 bg-blue-50 text-blue-600 rounded-xl"><i class="fa-solid fa-folder-open text-lg"></i></div>
        <div>
          <p class="text-xs text-slate-400">งานทั้งหมด</p>
          <p id="stat-all" class="text-xl font-bold text-slate-800">0</p>
        </div>
      </div>
      <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex items-center space-x-3">
        <div class="p-3 bg-amber-50 text-amber-600 rounded-xl"><i class="fa-solid fa-spinner text-lg"></i></div>
        <div>
          <p class="text-xs text-slate-400">รอดำเนินการ</p>
          <p id="stat-pending" class="text-xl font-bold text-slate-800">0</p>
        </div>
      </div>
      <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex items-center space-x-3">
        <div class="p-3 bg-indigo-50 text-indigo-600 rounded-xl"><i class="fa-solid fa-wrench text-lg"></i></div>
        <div>
          <p class="text-xs text-slate-400">กำลังทำ</p>
          <p id="stat-inprogress" class="text-xl font-bold text-slate-800">0</p>
        </div>
      </div>
      <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex items-center space-x-3">
        <div class="p-3 bg-emerald-50 text-emerald-600 rounded-xl"><i class="fa-solid fa-circle-check text-lg"></i></div>
        <div>
          <p class="text-xs text-slate-400">เสร็จสิ้น</p>
          <p id="stat-completed" class="text-xl font-bold text-slate-800">0</p>
        </div>
      </div>
    </div>

    <!-- Filter & Search Bar -->
    <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100 mb-6 flex flex-col md:flex-row gap-3 justify-between items-center">
      <div class="relative w-full md:w-80">
        <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
        <input type="text" id="search-input" onkeyup="filterJobs()" placeholder="ค้นหา Job ID, หัวข้อ หรือผู้แจ้ง..." class="w-full pl-10 pr-4 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500">
      </div>
      <div class="flex items-center gap-2 w-full md:w-auto overflow-x-auto pb-1 md:pb-0">
        <button onclick="setStatusFilter('ALL')" class="filter-btn active px-3.5 py-1.5 text-xs font-semibold rounded-xl bg-indigo-600 text-white transition whitespace-nowrap">ทั้งหมด</button>
        <button onclick="setStatusFilter('Pending')" class="filter-btn px-3.5 py-1.5 text-xs font-medium rounded-xl bg-slate-100 text-slate-600 hover:bg-slate-200 transition whitespace-nowrap">รอดำเนินการ</button>
        <button onclick="setStatusFilter('In Progress')" class="filter-btn px-3.5 py-1.5 text-xs font-medium rounded-xl bg-slate-100 text-slate-600 hover:bg-slate-200 transition whitespace-nowrap">กำลังทำ</button>
        <button onclick="setStatusFilter('Completed')" class="filter-btn px-3.5 py-1.5 text-xs font-medium rounded-xl bg-slate-100 text-slate-600 hover:bg-slate-200 transition whitespace-nowrap">เสร็จสิ้น</button>
      </div>
    </div>

    <!-- Job Cards Container -->
    <div id="job-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
      <div class="bg-white p-5 rounded-2xl border border-slate-100 animate-pulse space-y-3">
        <div class="h-4 bg-slate-200 rounded w-1/3"></div>
        <div class="h-5 bg-slate-200 rounded w-3/4"></div>
        <div class="h-3 bg-slate-100 rounded w-full"></div>
      </div>
    </div>

  </main>

  <!-- Modal: สร้างงานใหม่ -->
  <div id="job-modal" class="fixed inset-0 z-50 bg-slate-900/40 backdrop-blur-sm hidden items-center justify-center p-4 overflow-y-auto">
    <div class="bg-white rounded-3xl max-w-lg w-full p-6 shadow-2xl border border-slate-100 relative my-8 animate-in fade-in zoom-in-95 duration-200">
      <div class="flex justify-between items-center mb-5">
        <h3 class="text-lg font-bold text-slate-900 flex items-center gap-2">
          <i class="fa-solid fa-plus-circle text-indigo-600"></i> สร้างรายการงานใหม่
        </h3>
        <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 p-1 rounded-lg"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>

      <form id="create-job-form" onsubmit="handleCreateJob(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">ชื่อผู้แจ้ง <span class="text-rose-500">*</span></label>
          <input type="text" id="form-requester" required class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">หัวข้องาน <span class="text-rose-500">*</span></label>
          <input type="text" id="form-title" required class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">รายละเอียดงาน</label>
          <textarea id="form-details" rows="3" class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500"></textarea>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">ผู้รับผิดชอบ</label>
            <input type="text" id="form-assignee" class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">กำหนดส่ง</label>
            <input type="date" id="form-dueDate" class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500">
          </div>
        </div>

        <!-- แนบไฟล์รูปภาพ -->
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">รูปภาพประกอบงาน</label>
          <input type="file" id="form-image" accept="image/*" onchange="previewImage(event)" class="w-full text-xs text-slate-500 file:mr-3 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-indigo-50 file:text-indigo-600 hover:file:bg-indigo-100 cursor-pointer">
          <div id="image-preview-container" class="mt-3 hidden relative">
            <img id="image-preview" src="" class="h-32 w-full object-cover rounded-xl border border-slate-200">
            <button type="button" onclick="removeImage()" class="absolute top-2 right-2 bg-rose-500 text-white rounded-full w-6 h-6 flex items-center justify-center text-xs shadow-md"><i class="fa-solid fa-xmark"></i></button>
          </div>
        </div>

        <div class="pt-3 flex gap-3">
          <button type="button" onclick="closeModal()" class="w-1/2 py-2.5 border border-slate-200 text-slate-600 rounded-xl font-medium text-sm hover:bg-slate-50 transition">ยกเลิก</button>
          <button type="submit" id="btn-submit" class="w-1/2 py-2.5 bg-indigo-600 text-white rounded-xl font-medium text-sm hover:bg-indigo-700 transition shadow-md shadow-indigo-100 flex items-center justify-center gap-2">
            <span>บันทึกงาน</span>
          </button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbwPk6LFD1uxljIuVzpjprq41GZbFekaGmGtcO99d9gMcl6jlIIOtoGYgWuMJF98vv4C/exec';

    let allJobs = [];
    let currentFilter = 'ALL';
    let base64Image = '';

    window.addEventListener('DOMContentLoaded', fetchJobs);

    async function fetchJobs() {
      const container = document.getElementById('job-container');
      try {
        const res = await fetch(WEB_APP_URL);
        const result = await res.json();
        
        if (result.status === 'success') {
          allJobs = result.data;
          updateMetrics();
          renderJobs();
        } else {
          container.innerHTML = `<p class="text-rose-500 text-sm col-span-full text-center">เกิดข้อผิดพลาด: ${result.message}</p>`;
        }
      } catch (err) {
        container.innerHTML = `<p class="text-rose-500 text-sm col-span-full text-center">ไม่สามารถเชื่อมต่อกับ Web App API ได้ โปรดตรวจสอบ URL</p>`;
      }
    }

    function renderJobs() {
      const container = document.getElementById('job-container');
      const searchText = document.getElementById('search-input').value.toLowerCase();

      const filtered = allJobs.filter(job => {
        const matchesFilter = currentFilter === 'ALL' || job.Status === currentFilter;
        const matchesSearch = (job.Job_ID || '').toLowerCase().includes(searchText) ||
                              (job.Title || '').toLowerCase().includes(searchText) ||
                              (job.Requester || '').toLowerCase().includes(searchText);
        return matchesFilter && matchesSearch;
      });

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="col-span-full text-center py-12 bg-white rounded-2xl border border-slate-100">
            <i class="fa-solid fa-inbox text-3xl text-slate-300 mb-2"></i>
            <p class="text-sm text-slate-500">ไม่พบรายการงาน</p>
          </div>`;
        return;
      }

      container.innerHTML = filtered.map(job => {
        const statusClass = job.Status === 'Completed' ? 'bg-emerald-50 text-emerald-700 border-emerald-200' :
                            job.Status === 'In Progress' ? 'bg-indigo-50 text-indigo-700 border-indigo-200' :
                            'bg-amber-50 text-amber-700 border-amber-200';
        
        return `
          <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-100 flex flex-col justify-between hover:shadow-md transition">
            <div>
              <div class="flex items-center justify-between gap-2 mb-3">
                <span class="text-xs font-bold text-slate-400">${job.Job_ID || 'N/A'}</span>
                
                <div class="relative inline-block">
                  <select onchange="handleStatusChange('${job.Job_ID}', this.value)" 
                          class="appearance-none text-xs font-semibold px-3 py-1.5 pr-7 rounded-xl border cursor-pointer focus:outline-none transition ${statusClass}">
                    <option value="Pending" ${job.Status === 'Pending' ? 'selected' : ''}>⏳ รอดำเนินการ</option>
                    <option value="In Progress" ${job.Status === 'In Progress' ? 'selected' : ''}>⚙️ กำลังทำ</option>
                    <option value="Completed" ${job.Status === 'Completed' ? 'selected' : ''}>✅ เสร็จสิ้น</option>
                  </select>
                  <i class="fa-solid fa-chevron-down absolute right-2.5 top-1/2 -translate-y-1/2 text-xs opacity-60 pointer-events-none"></i>
                </div>
              </div>

              <h3 class="font-bold text-slate-900 text-base mb-1.5 leading-snug">${job.Title || 'ไม่มีหัวข้อ'}</h3>
              <p class="text-xs text-slate-500 line-clamp-2 mb-3">${job.Details || 'ไม่มีรายละเอียด'}</p>

              <!-- แสดงรูปภาพการ์ด (ถ้ามี) -->
              ${job.Image_URL ? `
                <div class="mb-3">
                  <a href="${job.Image_URL}" target="_blank" title="คลิกเพื่อดูรูปภาพขนาดใหญ่">
                    <img src="${job.Image_URL}" class="h-32 w-full object-cover rounded-xl border border-slate-100 hover:opacity-90 transition">
                  </a>
                </div>
              ` : ''}
            </div>

            <div class="border-t border-slate-100 pt-3 mt-2 flex justify-between items-center text-xs text-slate-500">
              <span class="flex items-center gap-1.5"><i class="fa-regular fa-user text-slate-400"></i> ${job.Requester || '-'}</span>
              <span class="flex items-center gap-1.5"><i class="fa-regular fa-calendar text-slate-400"></i> ${job.DueDate ? formatDate(job.DueDate) : '-'}</span>
            </div>
          </div>
        `;
      }).join('');
    }

    // แปลงไฟล์ภาพเป็น Base64 และสร้าง Preview
    function previewImage(event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          base64Image = e.target.result;
          document.getElementById('image-preview').src = base64Image;
          document.getElementById('image-preview-container').classList.remove('hidden');
        };
        reader.readAsDataURL(file);
      }
    }

    function removeImage() {
      base64Image = '';
      document.getElementById('form-image').value = '';
      document.getElementById('image-preview').src = '';
      document.getElementById('image-preview-container').classList.add('hidden');
    }

    async function handleStatusChange(jobId, newStatus) {
      const jobIndex = allJobs.findIndex(j => j.Job_ID === jobId);
      if (jobIndex !== -1) {
        allJobs[jobIndex].Status = newStatus;
        updateMetrics();
      }

      const payload = {
        action: 'update',
        data: { jobId: jobId, status: newStatus }
      };

      try {
        const res = await fetch(WEB_APP_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload)
        });
        const result = await res.json();
        if (result.status !== 'success') {
          alert('ไม่สามารถอัปเดตสถานะได้');
          await fetchJobs();
        }
      } catch (err) {
        alert('เกิดข้อผิดพลาดในการเชื่อมต่อ');
        await fetchJobs();
      }
    }

    function updateMetrics() {
      document.getElementById('stat-all').innerText = allJobs.length;
      document.getElementById('stat-pending').innerText = allJobs.filter(j => j.Status === 'Pending').length;
      document.getElementById('stat-inprogress').innerText = allJobs.filter(j => j.Status === 'In Progress').length;
      document.getElementById('stat-completed').innerText = allJobs.filter(j => j.Status === 'Completed').length;
    }

    async function handleCreateJob(event) {
      event.preventDefault();
      const btn = document.getElementById('btn-submit');
      btn.disabled = true;
      btn.innerHTML = `<i class="fa-solid fa-circle-notch animate-spin"></i> <span>กำลังอัปโหลด & บันทึก...</span>`;

      const payload = {
        action: 'create',
        data: {
          requester: document.getElementById('form-requester').value,
          title: document.getElementById('form-title').value,
          details: document.getElementById('form-details').value,
          assignee: document.getElementById('form-assignee').value,
          dueDate: document.getElementById('form-dueDate').value,
          status: 'Pending',
          imageBase64: base64Image
        }
      };

      try {
        await fetch(WEB_APP_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload)
        });

        closeModal();
        removeImage();
        document.getElementById('create-job-form').reset();
        await fetchJobs();
      } catch (err) {
        alert('เกิดข้อผิดพลาดในการบันทึกงาน');
      } finally {
        btn.disabled = false;
        btn.innerHTML = `<span>บันทึกงาน</span>`;
      }
    }

    function setStatusFilter(status) {
      currentFilter = status;
      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.classList.remove('bg-indigo-600', 'text-white');
        btn.classList.add('bg-slate-100', 'text-slate-600');
      });
      event.target.classList.remove('bg-slate-100', 'text-slate-600');
      event.target.classList.add('bg-indigo-600', 'text-white');
      renderJobs();
    }

    function filterJobs() { renderJobs(); }
    function openModal() { document.getElementById('job-modal').classList.remove('hidden'); document.getElementById('job-modal').classList.add('flex'); }
    function closeModal() { document.getElementById('job-modal').classList.add('hidden'); document.getElementById('job-modal').classList.remove('flex'); removeImage(); }
    function formatDate(dStr) { const d = new Date(dStr); return isNaN(d) ? dStr : d.toLocaleDateString('th-TH', { day: 'numeric', month: 'short' }); }
  </script>
</body>
</html>
