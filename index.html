<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TrackingJob - ระบบติดตามงาน</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Prompt', sans-serif; }
  </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 pb-12">

  <!-- Modal หน้า Login (ดึงข้อมูลจาก Sheet user ผ่าน API) -->
  <div id="loginModal" class="fixed inset-0 bg-slate-900/80 backdrop-blur-md z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-md w-full shadow-2xl overflow-hidden p-6 border border-slate-100">
      <div class="text-center mb-6">
        <div class="inline-flex p-3 bg-indigo-50 text-indigo-600 rounded-2xl mb-3">
          <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path>
          </svg>
        </div>
        <h2 class="text-2xl font-bold text-slate-800">เข้าสู่ระบบ TrackingJob</h2>
        <p class="text-xs text-slate-500 mt-1">กรุณากรอก Username และ Password จากระบบ</p>
      </div>

      <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-medium text-slate-700 mb-1">ชื่อผู้ใช้งาน (Username / Name)</label>
          <input type="text" id="loginUsername" required placeholder="กรอก Username เช่น 11111111" 
                 class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-700 mb-1">รหัสผ่าน (Password)</label>
          <input type="password" id="loginPassword" required placeholder="••••••••" 
                 class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>

        <div id="loginError" class="text-xs text-rose-500 hidden text-center font-medium">
          ชื่อผู้ใช้งานหรือรหัสผ่านไม่ถูกต้อง!
        </div>

        <button type="submit" id="loginBtn" class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-medium rounded-lg text-sm shadow transition-all">
          เข้าสู่ระบบ
        </button>
      </form>
    </div>
  </div>

  <!-- Navbar -->
  <nav class="bg-indigo-600 text-white shadow-md sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path>
        </svg>
        <span class="font-bold text-xl tracking-wide">TrackingJob</span>
      </div>

      <div class="flex items-center space-x-4">
        <div id="userInfo" class="hidden text-xs text-right">
          <span id="userNameDisplay" class="font-semibold block text-sm"></span>
          <span id="userRoleDisplay" class="text-indigo-200 text-[10px] bg-indigo-700/50 px-2 py-0.5 rounded-full"></span>
        </div>
        <button onclick="openModal()" class="bg-white text-indigo-600 hover:bg-indigo-50 font-medium px-3.5 py-1.5 rounded-lg text-sm transition-all shadow">
          + สร้างงานใหม่
        </button>
        <button onclick="logout()" class="text-indigo-100 hover:text-white text-xs underline">
          ออกจากระบบ
        </button>
      </div>
    </div>
  </nav>

  <!-- Main Content Area -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-8">
    
    <!-- Search & View Toggle Bar -->
    <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 mb-6 flex flex-col md:flex-row gap-4 justify-between items-center">
      <div class="relative w-full md:w-80">
        <input type="text" id="searchInput" onkeyup="filterJobs()" placeholder="ค้นหา Job ID, หัวข้อ..." 
               class="w-full pl-10 pr-4 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
        <svg class="w-5 h-5 text-slate-400 absolute left-3 top-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
        </svg>
      </div>

      <div class="flex flex-wrap items-center gap-2 w-full md:w-auto">
        <select id="statusFilter" onchange="filterJobs()" class="border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
          <option value="ALL">ทุกสถานะ</option>
          <option value="Pending">Pending</option>
          <option value="In Progress">In Progress</option>
          <option value="Completed">Completed</option>
        </select>

        <!-- Toggle View Mode Button -->
        <button id="viewToggleBtn" onclick="toggleViewMode()" class="px-3 py-2 bg-indigo-50 text-indigo-600 border border-indigo-200 rounded-lg text-sm font-medium hover:bg-indigo-100 transition">
          📊 มุมมอง: เรียงตามผู้รับผิดชอบ
        </button>

        <button onclick="fetchJobs()" class="p-2 border border-slate-300 rounded-lg hover:bg-slate-100 text-slate-600 transition" title="รีเฟรชข้อมูล">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
          </svg>
        </button>
      </div>
    </div>

    <!-- Metrics Stats -->
    <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
      <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm text-center">
        <span class="text-xs text-slate-500 font-medium">งานทั้งหมด</span>
        <div id="stat-total" class="text-2xl font-bold text-slate-800 mt-1">0</div>
      </div>
      <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm text-center">
        <span class="text-xs text-indigo-500 font-medium">Pending</span>
        <div id="stat-pending" class="text-2xl font-bold text-indigo-600 mt-1">0</div>
      </div>
      <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm text-center">
        <span class="text-xs text-amber-500 font-medium">In Progress</span>
        <div id="stat-progress" class="text-2xl font-bold text-amber-600 mt-1">0</div>
      </div>
      <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm text-center">
        <span class="text-xs text-emerald-500 font-medium">Completed</span>
        <div id="stat-completed" class="text-2xl font-bold text-emerald-600 mt-1">0</div>
      </div>
    </div>

    <!-- Container สำหรับแสดงผลการ์ดงาน -->
    <div id="job-container" class="space-y-8">
      <div class="text-center py-12 text-slate-400">กำลังโหลดข้อมูล...</div>
    </div>

  </main>

  <!-- Modal สำหรับสร้าง/แก้ไข งาน -->
  <div id="jobModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4 overflow-y-auto">
    <div class="bg-white rounded-2xl max-w-lg w-full shadow-2xl overflow-hidden my-8">
      <div class="bg-indigo-600 px-6 py-4 flex justify-between items-center text-white">
        <h3 id="modalTitle" class="font-bold text-lg">สร้างรายการงานใหม่</h3>
        <button onclick="closeModal()" class="text-white/80 hover:text-white text-xl">&times;</button>
      </div>

      <form id="jobForm" onsubmit="handleFormSubmit(event)" class="p-6 space-y-4">
        <input type="hidden" id="editJobId">
        
        <div>
          <label class="block text-xs font-medium text-slate-700 mb-1">หัวข้องาน *</label>
          <input type="text" id="formTitle" required class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-medium text-slate-700 mb-1">ผู้แจ้งเรื่อง *</label>
            <input type="text" id="formRequester" required class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-700 mb-1">ผู้รับผิดชอบ</label>
            <select id="formAssignee" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
              <option value="ฉัตรชัย">ฉัตรชัย</option>
              <option value="ศรานนท์">ศรานนท์</option>
              <option value="จิรวัฒณ์">จิรวัฒณ์</option>
              <option value="ชัยวัตน์">ชัยวัตน์</option>
              <option value="ไม่ระบุ">ไม่ระบุ</option>
            </select>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-medium text-slate-700 mb-1">สถานะ</label>
            <select id="formStatus" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
              <option value="Pending">Pending</option>
              <option value="In Progress">In Progress</option>
              <option value="Completed">Completed</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-700 mb-1">วันกำหนดส่ง</label>
            <input type="date" id="formDueDate" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
          </div>
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-700 mb-1">รายละเอียดงาน</label>
          <textarea id="formDetails" rows="3" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none"></textarea>
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-700 mb-1">แนบรูปภาพ</label>
          <input type="file" id="formImage" accept="image/*" class="w-full text-xs text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100">
        </div>

        <div class="flex justify-end space-x-3 pt-4 border-t border-slate-100">
          <button type="button" onclick="closeModal()" class="px-4 py-2 border border-slate-300 text-slate-600 rounded-lg text-sm hover:bg-slate-50">ยกเลิก</button>
          <button type="submit" id="submitBtn" class="px-4 py-2 bg-indigo-600 text-white rounded-lg text-sm hover:bg-indigo-700">บันทึกข้อมูล</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbwPk6LFD1uxljIuVzpjprq41GZbFekaGmGtcO99d9gMcl6jlIIOtoGYgWuMJF98vv4C/exec';

    let currentUser = null;
    let allJobs = [];
    let isGroupByAssignee = true; // ค่าเริ่มต้นเรียงตามผู้รับผิดชอบ

    document.addEventListener('DOMContentLoaded', () => {
      checkLoginSession();
    });

    // 1. ระบบ Login (ยิงเช็คกับ Sheet user ผ่าน Google Apps Script)
    async function handleLogin(e) {
      e.preventDefault();
      const usernameInput = document.getElementById('loginUsername').value.trim();
      const passwordInput = document.getElementById('loginPassword').value.trim();
      const errorDiv = document.getElementById('loginError');
      const loginBtn = document.getElementById('loginBtn');

      errorDiv.classList.add('hidden');
      loginBtn.disabled = true;
      loginBtn.innerText = 'กำลังตรวจสอบ...';

      try {
        const response = await fetch(WEB_APP_URL, {
          method: 'POST',
          body: JSON.stringify({
            action: 'login',
            username: usernameInput,
            password: passwordInput
          })
        });

        const result = await response.json();

        if (result.status === 'success') {
          currentUser = result.user;
          localStorage.setItem('trackingJobUser', JSON.stringify(currentUser));
          document.getElementById('loginModal').classList.add('hidden');
          updateUserUI();
          fetchJobs();
        } else {
          errorDiv.innerText = result.message || 'ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง!';
          errorDiv.classList.remove('hidden');
        }
      } catch (err) {
        errorDiv.innerText = 'เกิดข้อผิดพลาดในการเชื่อมต่อเซิร์ฟเวอร์';
        errorDiv.classList.remove('hidden');
      } finally {
        loginBtn.disabled = false;
        loginBtn.innerText = 'เข้าสู่ระบบ';
      }
    }

    function checkLoginSession() {
      const savedUser = localStorage.getItem('trackingJobUser');
      if (savedUser) {
        currentUser = JSON.parse(savedUser);
        document.getElementById('loginModal').classList.add('hidden');
        updateUserUI();
        fetchJobs();
      } else {
        document.getElementById('loginModal').classList.remove('hidden');
      }
    }

    function logout() {
      localStorage.removeItem('trackingJobUser');
      location.reload();
    }

    function updateUserUI() {
      if (currentUser) {
        document.getElementById('userInfo').classList.remove('hidden');
        document.getElementById('userNameDisplay').innerText = currentUser.name;
        document.getElementById('userRoleDisplay').innerText = currentUser.role;
        document.getElementById('formRequester').value = currentUser.name;
      }
    }

    // 2. ดึงข้อมูลงานจาก Apps Script
    async function fetchJobs() {
      const container = document.getElementById('job-container');
      container.innerHTML = `<div class="text-center py-12 text-slate-400">กำลังโหลดข้อมูล...</div>`;
      
      try {
        const res = await fetch(WEB_APP_URL, { redirect: 'follow' });
        const result = await res.json();
        
        if (result.status === 'success') {
          allJobs = result.data || [];
          updateMetrics();
          filterJobs();
        } else {
          container.innerHTML = `<div class="text-center py-12 text-rose-500">เกิดข้อผิดพลาด: ${result.message}</div>`;
        }
      } catch (err) {
        container.innerHTML = `<div class="text-center py-12 text-rose-500">ไม่สามารถเชื่อมต่อ API ได้</div>`;
      }
    }

    function getDriveThumbnailUrl(rawUrl) {
      if (!rawUrl) return '';
      if (rawUrl.includes('drive.google.com/thumbnail')) return rawUrl;
      let fileId = '';
      const lh3Match = rawUrl.match(/\/d\/([a-zA-Z0-9_-]+)/);
      if (lh3Match && lh3Match[1]) fileId = lh3Match[1];
      if (!fileId) {
        const fileMatch = rawUrl.match(/\/d\/([a-zA-Z0-9_-]+)/) || rawUrl.match(/id=([a-zA-Z0-9_-]+)/);
        if (fileMatch && fileMatch[1]) fileId = fileMatch[1];
      }
      return fileId ? `https://drive.google.com/thumbnail?id=${fileId}&sz=w1000` : rawUrl;
    }

    // 3. สลับมุมมอง
    function toggleViewMode() {
      isGroupByAssignee = !isGroupByAssignee;
      const btn = document.getElementById('viewToggleBtn');
      btn.innerText = isGroupByAssignee 
        ? '📊 มุมมอง: เรียงตามผู้รับผิดชอบ' 
        : '📇 มุมมอง: การ์ดรวมทั้งหมด';
      filterJobs();
    }

    // 4. แสดงผลการ์ดงาน (รองรับการจัดกลุ่มตามผู้รับผิดชอบ)
    function renderJobs(jobsList) {
      const container = document.getElementById('job-container');
      
      if (!jobsList || jobsList.length === 0) {
        container.innerHTML = `<div class="text-center py-12 text-slate-400">ไม่พบรายการข้อมูลงาน</div>`;
        return;
      }

      if (isGroupByAssignee) {
        const grouped = {};
        jobsList.forEach(job => {
          const assignee = job.Assignee || 'ไม่ระบุผู้รับผิดชอบ';
          if (!grouped[assignee]) grouped[assignee] = [];
          grouped[assignee].push(job);
        });

        container.innerHTML = Object.keys(grouped).map(assignee => {
          const jobs = grouped[assignee];
          return `
            <div class="bg-slate-100/70 p-5 rounded-2xl border border-slate-200/80">
              <div class="flex items-center justify-between mb-4 pb-2 border-b border-slate-200">
                <div class="flex items-center space-x-2">
                  <span class="w-3 h-3 rounded-full bg-indigo-600"></span>
                  <h2 class="font-bold text-slate-800 text-lg">${assignee}</h2>
                  <span class="text-xs bg-indigo-100 text-indigo-700 px-2 py-0.5 rounded-full font-medium">${jobs.length} งาน</span>
                </div>
              </div>
              <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
                ${jobs.map(job => createCardHTML(job)).join('')}
              </div>
            </div>`;
        }).join('');
      } else {
        container.innerHTML = `
          <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            ${jobsList.map(job => createCardHTML(job)).join('')}
          </div>`;
      }
    }

    function createCardHTML(job) {
      const rawImage = job.Image_URL || job.imageUrl || '';
      const validImageUrl = getDriveThumbnailUrl(rawImage);

      const imageHTML = validImageUrl ? `
        <div class="w-full h-44 overflow-hidden rounded-t-xl bg-slate-100 relative group">
          <img src="${validImageUrl}" alt="${job.Title || 'Job Image'}" 
               class="w-full h-full object-cover transition-transform duration-300 group-hover:scale-105"
               loading="lazy" onerror="this.parentElement.style.display='none';" />
        </div>` : '';

      const statusColor = job.Status === 'Completed' 
        ? 'bg-emerald-100 text-emerald-800 border-emerald-200' 
        : job.Status === 'In Progress' 
          ? 'bg-amber-100 text-amber-800 border-amber-200' 
          : 'bg-indigo-100 text-indigo-800 border-indigo-200';

      return `
        <div class="bg-white rounded-xl shadow-sm hover:shadow-md transition-all border border-slate-200 flex flex-col overflow-hidden">
          ${imageHTML}
          <div class="p-4 flex-1 flex flex-col justify-between">
            <div>
              <div class="flex items-center justify-between gap-2 mb-2">
                <span class="text-xs font-mono px-2 py-0.5 bg-slate-100 text-slate-600 rounded">
                  ${job.Job_ID || '-'}
                </span>
                <span class="text-xs font-medium px-2.5 py-0.5 rounded-full border ${statusColor}">
                  ${job.Status || 'Pending'}
                </span>
              </div>
              <h3 class="font-bold text-slate-800 text-base mb-1 line-clamp-1">${job.Title || 'ไม่มีหัวข้อ'}</h3>
              <p class="text-slate-600 text-xs mb-3 line-clamp-2">${job.Details || '-'}</p>
            </div>
            <div>
              <div class="pt-2 border-t border-slate-100 flex items-center justify-between text-xs text-slate-500 mb-2">
                <div><span class="text-slate-400">ผู้แจ้ง:</span> ${job.Requester || '-'}</div>
                <div><span class="text-slate-400">กำหนด:</span> ${job.DueDate || '-'}</div>
              </div>
              <div class="flex items-center justify-end space-x-2 pt-2 border-t border-slate-50">
                <button onclick="editJob('${job.Job_ID}')" class="text-xs text-indigo-600 hover:text-indigo-800 font-medium px-2 py-1 rounded hover:bg-indigo-50">แก้ไข</button>
                <button onclick="deleteJob('${job.Job_ID}')" class="text-xs text-rose-600 hover:text-rose-800 font-medium px-2 py-1 rounded hover:bg-rose-50">ลบ</button>
              </div>
            </div>
          </div>
        </div>`;
    }

    function updateMetrics() {
      document.getElementById('stat-total').innerText = allJobs.length;
      document.getElementById('stat-pending').innerText = allJobs.filter(j => j.Status === 'Pending').length;
      document.getElementById('stat-progress').innerText = allJobs.filter(j => j.Status === 'In Progress').length;
      document.getElementById('stat-completed').innerText = allJobs.filter(j => j.Status === 'Completed').length;
    }

    function filterJobs() {
      const searchValue = document.getElementById('searchInput').value.toLowerCase();
      const statusValue = document.getElementById('statusFilter').value;

      const filtered = allJobs.filter(job => {
        const matchesSearch = (job.Job_ID && job.Job_ID.toLowerCase().includes(searchValue)) ||
                              (job.Title && job.Title.toLowerCase().includes(searchValue)) ||
                              (job.Assignee && job.Assignee.toLowerCase().includes(searchValue));
        const matchesStatus = statusValue === 'ALL' || job.Status === statusValue;
        return matchesSearch && matchesStatus;
      });

      renderJobs(filtered);
    }

    function convertFileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => resolve(reader.result);
        reader.onerror = error => reject(error);
      });
    }

    async function handleFormSubmit(e) {
      e.preventDefault();
      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = true;
      submitBtn.innerText = 'กำลังบันทึก...';

      const jobId = document.getElementById('editJobId').value;
      const fileInput = document.getElementById('formImage');
      let imageBase64 = '';

      if (fileInput.files.length > 0) {
        imageBase64 = await convertFileToBase64(fileInput.files[0]);
      }

      const payload = {
        action: jobId ? 'update' : 'create',
        jobId: jobId || undefined,
        data: {
          jobId: jobId || undefined,
          title: document.getElementById('formTitle').value,
          requester: document.getElementById('formRequester').value,
          assignee: document.getElementById('formAssignee').value,
          status: document.getElementById('formStatus').value,
          dueDate: document.getElementById('formDueDate').value,
          details: document.getElementById('formDetails').value,
          imageBase64: imageBase64 || undefined
        }
      };

      try {
        const res = await fetch(WEB_APP_URL, { method: 'POST', body: JSON.stringify(payload) });
        const result = await res.json();
        if (result.status === 'success') {
          closeModal();
          fetchJobs();
        } else {
          alert('เกิดข้อผิดพลาด: ' + result.message);
        }
      } catch (err) {
        alert('ไม่สามารถบันทึกข้อมูลได้');
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = 'บันทึกข้อมูล';
      }
    }

    async function deleteJob(jobId) {
      if (!confirm(`คุณต้องการลบรายการ ${jobId} ใช่หรือไม่?`)) return;
      try {
        const res = await fetch(WEB_APP_URL, { method: 'POST', body: JSON.stringify({ action: 'delete', jobId: jobId }) });
        const result = await res.json();
        if (result.status === 'success') fetchJobs();
      } catch (err) {
        alert('เกิดข้อผิดพลาดในการลบรายการ');
      }
    }

    function openModal() {
      document.getElementById('jobForm').reset();
      document.getElementById('editJobId').value = '';
      if (currentUser) document.getElementById('formRequester').value = currentUser.name;
      document.getElementById('modalTitle').innerText = 'สร้างรายการงานใหม่';
      document.getElementById('jobModal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('jobModal').classList.add('hidden');
    }

    function editJob(jobId) {
      const job = allJobs.find(j => j.Job_ID === jobId);
      if (!job) return;

      document.getElementById('editJobId').value = job.Job_ID;
      document.getElementById('formTitle').value = job.Title || '';
      document.getElementById('formRequester').value = job.Requester || '';
      document.getElementById('formAssignee').value = job.Assignee || 'ฉัตรชัย';
      document.getElementById('formStatus').value = job.Status || 'Pending';
      document.getElementById('formDueDate').value = job.DueDate || '';
      document.getElementById('formDetails').value = job.Details || '';
      
      document.getElementById('modalTitle').innerText = `แก้ไขงาน (${job.Job_ID})`;
      document.getElementById('jobModal').classList.remove('hidden');
    }
  </script>
</body>
</html>
